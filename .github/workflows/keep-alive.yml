name: keep-alive

# Render's free tier sleeps the backend after ~15 minutes of inactivity.
# Pinging /health a little more often than that keeps it awake. Runs are
# best-effort: GitHub may delay scheduled jobs, and disables the schedule after
# 60 days of repo inactivity, so the in-app keep-alive (see
# frontend/src/lib/keepAlive.ts) is the primary mechanism.
on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://learnquest-bwlf.onrender.com/health
