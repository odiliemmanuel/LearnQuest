server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin/seed uploads (avatars, book text) can be large.
    client_max_body_size 25m;

    # The frontend calls the API with relative paths (/api/v1/...), so the
    # backend is proxied on the same origin. That keeps the browser from
    # needing CORS at all. If you serve the API from a different host
    # instead, set CORS_ORIGINS on the backend to this site's origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients keep booting an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: BrowserRouter routes like /library must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}