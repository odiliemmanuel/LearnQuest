# Full application stack: postgres + rabbitmq + backend + frontend.
# The notification service is deployed separately and consumes from RabbitMQ,
# so it is intentionally NOT part of this file.
#
#   cp .env.example .env      # fill it in
#   docker compose up -d --build
#
# Docker Compose reads the .env file in THIS directory for variable
# interpolation, and also passes it to the backend container. So the deploy
# secrets live here, not in backend/.env. (backend/.env is for running the
# backend directly on the host, outside Docker.)
#
# The backend runs migrations and seeds on boot, so an empty postgres volume
# is enough to get a working install.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-learnquest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnquest} -d ${POSTGRES_DB:-learnquest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-learnquest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      # The management UI is useful for confirming the outbox is draining.
      - "${RABBITMQ_UI_PORT:-15672}:15672"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      # Built from the credentials above so the password is only ever written
      # once, in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnquest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-learnquest}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-learnquest}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Seeding ~680 curriculum topics plus 500+ library notes on first boot
      # takes a while before /health starts answering.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  postgres-data:
  rabbitmq-data: